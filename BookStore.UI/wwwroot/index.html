<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>خانه کتاب</title>
    <base href="/" />
    <!-- Peyda Regular is the workhorse weight (all body text); preload it so the font is
         fetched in parallel with CSS/JS and is ready before first render (no swap flash).
         crossorigin is required for font preloads, even same-origin. -->
    <link rel="preload" href="fonts/Peyda/01-Standard/WebFonts/fonts/woff2/PeydaWeb-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Vendored libs — pinned versions: Bootstrap v5.3.3, Bootstrap Icons v1.13.1.
         See wwwroot/lib/README.md (authoritative version manifest + upgrade checklist,
         incl. re-verifying the Peyda font contract after any upgrade). -->
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link href="BookStore.UI.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        خطای غیرمنتظره‌ای رخ داد.
        <a href="." class="reload">بارگذاری مجدد</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        window.bookstoreDownload = function (bytes, fileName) {
            const blob = new Blob([bytes], { type: 'application/epub+zip' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName || 'book.epub';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };

        // Copies text to the clipboard. The modern API needs a secure context (https or
        // localhost); otherwise we fall back to a hidden textarea + execCommand('copy').
        window.bookstoreCopyText = function (text) {
            const fallback = function () {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                let ok = false;
                try {
                    ok = document.execCommand('copy');
                } catch (e) {
                    ok = false;
                }
                document.body.removeChild(ta);
                return ok;
            };

            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(text)
                    .then(function () { return true; })
                    .catch(function () { return fallback(); });
            }
            return Promise.resolve(fallback());
        };

        window.bookstoreCanShare = function () {
            return typeof navigator.share === 'function';
        };

        // Invokes the native share sheet (title + URL). Resolves true when shared, false when
        // the user cancelled or the browser has no share support.
        window.bookstoreShare = function (title, url) {
            if (typeof navigator.share !== 'function') {
                return Promise.resolve(false);
            }
            try {
                return navigator.share({ title: title, url: url })
                    .then(function () { return true; })
                    .catch(function () { return false; });
            } catch (e) {
                return Promise.resolve(false);
            }
        };
    </script>
</body>

</html>
